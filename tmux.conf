# change prefix to C-f
set-option -g prefix C-f
unbind-key C-b
bind-key f send-prefix
bind-key C-w send-prefix

# vim keys in copy and choose mode
set-window-option -g mode-keys vi

# copying selection vim style
# http://jasonwryan.com/blog/2011/06/07/copy-and-paste-in-tmux/
# https://github.com/myfreeweb/dotfiles/blob/master/tmux.conf
bind-key Escape copy-mode			# enter copy mode; default [
bind-key p paste-buffer				# paste; (default hotkey: ] )
bind-key P choose-buffer 			# tmux clipboard history
bind-key + delete-buffer \; display-message "Deleted current Tmux Clipboard History"

bind-key -T copy-mode-vi v send-keys -X begin-selection;
bind-key -T copy-mode-vi V send-keys -X select-line;
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle;
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -in -selection clipboard"

#resize panes (disabled)
#bind k resize-pane -U 10
#bind j resize-pane -D 10
#bind h resize-pane -L 10
#bind l resize-pane -R 10

# map keys to switch panes (vim-style with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize pane with ctrl-z
bind -n F1 resize-pane -Z

bind-key -n F2 previous-window
bind-key -n F3 next-window

# detach client
#bind d detach
#bind : command-prompt

# set default shell to zsh
set-option -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"

# Ctrl-Left/Right cycles thru panes (no prefix)
# bind-key "C-Left"  select-pane -t :-
# bind-key "C-Right" select-pane -t :+

# set -g @plugin 'tmux-plugins/tmux-copycat'
# set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @yank_selection 'primary'

# source "${HOME}/.tmux-themes/basic.tmuxtheme"



set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'

# True color support
set-option -sa terminal-overrides ",xterm-256color:RGB"
set-option -sa terminal-overrides ",tmux-256color:RGB"

# Treat black background as default/transparent background
# Fixes apps that emit explicit bg=black clashing with non-black terminal themes
set -g window-style "bg=default"
set -g window-active-style "bg=default"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
